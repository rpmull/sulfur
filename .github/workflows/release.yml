# Run manually after native acceptance testing. Pushing never builds or releases an app.
name: release
# The version is 1.0.<commits reachable from the dispatched commit>: the same commit always
# releases as the same version, and each later commit as a higher one.
on:
  workflow_dispatch:
    inputs:
      windows-x86_64:
        description: Windows x64 (NSIS installer)
        type: boolean
        default: true
      darwin-x86_64:
        description: macOS Intel
        type: boolean
        default: true
      darwin-aarch64:
        description: macOS Apple Silicon
        type: boolean
        default: true
      linux-x86_64:
        description: Linux x64 (.deb, AppImage)
        type: boolean
        default: true
      linux-aarch64:
        description: Linux arm64 (.deb, AppImage)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: sulfur-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.count.outputs.version }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: count
        run: echo "version=1.0.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      # only the platforms ticked when the run was started
      - id: targets
        env:
          PICKED: ${{ toJSON(inputs) }}
        run: |
          targets=$(jq -c --argjson picked "$PICKED" '[.[] | select($picked[.name] == true)]' <<'JSON'
          [
            { "runner": "windows-2022", "name": "windows-x86_64" },
            { "runner": "macos-15-intel", "name": "darwin-x86_64" },
            { "runner": "macos-15", "name": "darwin-aarch64" },
            { "runner": "ubuntu-24.04", "name": "linux-x86_64" },
            { "runner": "ubuntu-24.04-arm", "name": "linux-aarch64" }
          ]
          JSON
          )
          if [ "$targets" = "[]" ]; then echo "::error::Pick at least one platform"; exit 1; fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
  app:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SULFUR_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/download/update
      # public, but saved as a secret just as well
      SULFUR_UPDATE_PUBKEY: ${{ vars.UPDATE_PUBKEY || secrets.UPDATE_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_PASSWORD }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: native prerequisites
        if: startsWith(matrix.runner, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2t64
      - name: Rust
        run: rustup update stable && rustup default stable
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check && bun run test
      # Tauri takes an empty Apple variable as one that is set, so only those with values are
      # passed on; with none the app is ad-hoc signed and not notarized
      - name: Apple signing, when configured
        if: startsWith(matrix.runner, 'macos')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<APPLE_EOF"; echo "${!name}"; echo APPLE_EOF; } >> "$GITHUB_ENV"
            fi
          done
      - name: version and signing configuration
        run: bun scripts/release-version.js
      - name: license notices
        run: bun run licenses
      # verbose so a failing bundler tool (linuxdeploy, signtool) shows its own output; the
      # AppImage tools unpack themselves rather than mount through FUSE
      - name: native app and signed updater
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bun run build --verbose --config src-tauri/tauri.release.conf.json
      - name: collect packages and legacy-compatible feeds
        run: bun scripts/release-artifacts.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sulfur-${{ matrix.name }}
          path: out/
          compression-level: 0
          retention-days: 7
  # the page alone, as Phosphorus's apps page installs it onto a mesh; one job, whatever
  # platforms were picked
  web:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:web
      - name: signed web build and its feed
        run: bun scripts/release-web.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sulfur-web
          path: out/
          compression-level: 0
          retention-days: 7
  publish:
    needs: [version, app, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LEGACY_TOKEN: ${{ secrets.PHOSPHORUS_FEED_TOKEN }}
      LEGACY_FEED_REPO: ${{ vars.LEGACY_FEED_REPO || 'pmghartman/phosphorus' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sulfur-*
          merge-multiple: true
          path: out
      - name: numbered release
        run: |
          printf 'Sulfur %s: one native app with its service in process, and compatible Phosphorus mesh and shared files. sulfur-web.tar.gz is the page alone, installed onto a mesh by the Phosphorus apps page.\n' "$VERSION" > notes.md
          # a run of some platforms publishes what they built
          shopt -s nullglob
          files=(out/*.exe out/*.dmg out/*.deb out/*.AppImage out/*.tar.gz out/*.sig out/LICENSE out/THIRD_PARTY_LICENSES.txt)
          gh release create "v$VERSION" "${files[@]}" --target "${{ github.sha }}" --title "Sulfur $VERSION" --notes-file notes.md
      - name: update feeds (retain the existing signing key)
        run: |
          gh release view update >/dev/null 2>&1 || gh release create update --prerelease --latest=false --title 'Update feed' --notes 'Signed Sulfur update manifests.'
          gh release upload update out/feed/*.json --clobber
          if [ -n "$LEGACY_TOKEN" ]; then
            GH_TOKEN="$LEGACY_TOKEN" gh release upload update out/feed/*.json --clobber --repo "$LEGACY_FEED_REPO"
          fi
