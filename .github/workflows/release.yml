# Run manually after native acceptance testing. Pushing tauri-js never builds/releases an app.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Three-part version, higher than every published Sulfur (for example 1.108.0)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sulfur-release
  cancel-in-progress: false
jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, name: windows-x86_64 }
          - { runner: macos-15-intel, name: darwin-x86_64 }
          - { runner: macos-15, name: darwin-aarch64 }
          - { runner: ubuntu-24.04, name: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, name: linux-aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      SULFUR_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/download/update
      SULFUR_UPDATE_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_PASSWORD }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: native prerequisites
        if: startsWith(matrix.runner, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Rust
        run: rustup update stable && rustup default stable
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check && bun test ./tests && bun run scripts/test-web.js
      - name: version and signing configuration
        run: bun scripts/release-version.js
      - name: license notices
        run: bun run licenses
      - name: native app and signed updater
        run: bun run build --config src-tauri/tauri.release.conf.json
      - name: collect packages and legacy-compatible feeds
        run: bun scripts/release-artifacts.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sulfur-${{ matrix.name }}
          path: out/
          compression-level: 0
          retention-days: 7
  publish:
    needs: app
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LEGACY_TOKEN: ${{ secrets.PHOSPHORUS_FEED_TOKEN }}
      LEGACY_FEED_REPO: ${{ vars.LEGACY_FEED_REPO || 'pmghartman/phosphorus' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sulfur-*
          merge-multiple: true
          path: out
      - name: numbered release
        run: |
          printf 'Sulfur %s: Tauri desktop, Bun/JavaScript services, and compatible Phosphorus mesh and shared files.\n' "$VERSION" > notes.md
          gh release create "v$VERSION" out/*.exe out/*.dmg out/*.deb out/*.AppImage out/*.tar.gz out/*.sig out/LICENSE out/THIRD_PARTY_LICENSES.txt --target "${{ github.sha }}" --title "Sulfur $VERSION" --notes-file notes.md
      - name: update feeds (retain the existing signing key)
        run: |
          gh release view update >/dev/null 2>&1 || gh release create update --prerelease --latest=false --title 'Update feed' --notes 'Signed Sulfur update manifests.'
          gh release upload update out/feed/*.json --clobber
          if [ -n "$LEGACY_TOKEN" ]; then
            GH_TOKEN="$LEGACY_TOKEN" gh release upload update out/feed/*.json --clobber --repo "$LEGACY_FEED_REPO"
          fi
