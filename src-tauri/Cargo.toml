[package]
name = "sulfur"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-updater = "=2.14.0"
sulfur-service = { path = "service" }
serde_json = "1"
base64 = "=0.22.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
# small code everywhere but where the service does its real work
opt-level = "s"
# a panic in one request's task ends that request, never the editor with unsaved work in it
panic = "unwind"

[profile.release.package.sulfur-service]
opt-level = 3

[profile.release.package.libsqlite3-sys]
opt-level = 3

[workspace]
members = [".", "service"]
