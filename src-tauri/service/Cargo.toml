[package]
name = "sulfur-service"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
description = "Sulfur's local IDE service: files, live editing, terminals, builds, language servers, SQLite, Open VSX and the mesh link"
license = "Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22.1"
bytes = "1"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
http-body-util = "0.1"
minisign-verify = "0.3"
portable-pty = "0.9"
regex = "1"
# SSH hosts: pure Rust (no OpenSSL or libssh2 to build per platform), tokio-native,
# password, keyboard-interactive, key and agent logins, PTYs; ring as rustls has it
ring = "0.17"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "system-proxy"] }
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "process", "io-util", "io-std", "time", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
unicode-normalization = "0.1"
url = "2"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
flate2 = "1"

[dev-dependencies]
tempfile = "3"
